name: Test electron-chrome-extensions

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      # Corepack must be enabled before setup-node: its default caching runs
      # yarn to locate the cache dir, which fails if the global yarn 1.x sees
      # the packageManager field.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      # xvfb-run replaces the unmaintained GabrielBB/xvfb-action, which
      # still targets the deprecated Node 20 action runtime.
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum -- yarn test

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: yarn test
