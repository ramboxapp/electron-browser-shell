name: Publish electron-chrome-extensions package

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      # Corepack must be enabled before setup-node: its default caching runs
      # yarn to locate the cache dir, which fails if the global yarn 1.x sees
      # the packageManager field.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Publish to GitHub Packages
        run: npm publish
        working-directory: packages/electron-chrome-extensions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
